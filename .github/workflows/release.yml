# Builds the Windows installer and attaches it to a DRAFT GitHub release.
#
# Two ways in:
#   - push a tag matching v*  (normal path: `git tag v1.1.0 && git push origin v1.1.0`)
#   - run it by hand from the Actions tab (for re-runs, or building a draft before tagging)
#
# package.json's `version` is the single source of truth. On a tag push the tag must match
# it exactly or the build fails fast — that check is what stops the app from shipping with
# an APP_VERSION that disagrees with the release it is being compared against.
#
# The release is left as a DRAFT on purpose: the in-app update check reads
# /releases/latest, so a release only starts advertising itself once you publish it.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed to create the release and upload the installer to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        # Windows runners default to PowerShell; the scripted steps below are written for
        # POSIX sh, and Git Bash ships on the runner image.
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deliberately NOT caching electron-builder's downloads (the Electron zip and NSIS
      # toolchain). It looks like an obvious win but measurement on the v1.1.0 run says
      # otherwise: the runner pulls all four archives in ~0.7s total (115MB of Electron in
      # 321ms), while restoring the 241MB cache costs several seconds and a chunk of the
      # repo's cache quota. The real cost inside the package step is ~30s of NSIS
      # compressing the installer, which no cache can touch.
      #
      # The npm cache above (actions/setup-node `cache: npm`) is worth keeping — it stores
      # verified tarballs that `npm ci` re-checks against package-lock.json's integrity
      # hashes. Note that caching `node_modules` itself is a different proposition and is
      # avoided on purpose: it would freeze the resolution of the `registry-js`
      # optionalDependency, which npm silently skips when it can't build, so a cache
      # written during a bad run would keep shipping the folder-fallback Steam discovery
      # with nothing in the log to say so.
      - name: Install dependencies
        run: npm ci

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag '$TAG' does not match package.json version '$VERSION'."
              echo "::error::package.json is the single source of truth. Bump it to match the tag (or delete and re-create the tag as 'v$VERSION'), then push again."
              exit 1
            fi
          else
            # Manual run: derive the tag from package.json. Because the release is a draft,
            # GitHub does not actually create this tag until you publish it.
            TAG="v$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "installer=dist/Umbra-Game-Patcher-Setup-$VERSION.exe" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (package.json version $VERSION)"

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer, preload and main
        run: npx electron-vite build

      # --publish never: this workflow decides what gets uploaded, not electron-builder.
      # It keeps the release to just the installer, leaving the blockmap and latest.yml
      # (auto-updater metadata this app deliberately does not use) out of the release.
      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify the installer exists
        run: |
          set -euo pipefail
          INSTALLER="${{ steps.meta.outputs.installer }}"
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Expected installer at '$INSTALLER' but it is missing. Contents of dist/:"
            ls -la dist/ || true
            exit 1
          fi
          echo "Found $INSTALLER ($(du -h "$INSTALLER" | cut -f1))"

      - name: Create draft release with the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Umbra Game Patcher ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.meta.outputs.installer }}
